# SPDX-License-Identifier: PMPL-1.0-or-later
# error-lang-lsp — Language Server Protocol implementation for Error-Lang.
#
# Error-Lang is an educational programming language where errors are features.
# This LSP server provides IDE support including diagnostics with computational
# haptics awareness, keyword completion, and hover documentation.

[package]
name = "error-lang-lsp"
version = "0.1.0"
edition = "2021"
license = "PMPL-1.0-or-later"
description = "LSP server for the Error-Lang educational language"
repository = "https://github.com/hyperpolymath/nextgen-languages"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]

[[bin]]
name = "error-lang-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
dashmap = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
