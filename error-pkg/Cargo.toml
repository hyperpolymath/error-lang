[package]
name = "error-pkg"
version = "0.1.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
license = "MPL-2.0"
description = "Package manager for error-lang with computational haptics"
repository = "https://github.com/hyperpolymath/error-lang"

[[bin]]
name = "error-pkg"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
semver = "1.0"

[lib]
name = "error_pkg"
path = "src/lib.rs"
