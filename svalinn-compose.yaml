# Svalinn/Vordr Verified Container Orchestration for Error-Lang
#
# Deploys Error-Lang IDE, LSP server, and VM with formal verification

version: "3.8"

x-svalinn:
  policy: strict
  verify: true
  attestations:
    require-sbom: true
    require-signature: true
    require-provenance: true
  crypto:
    - dilithium5
    - sphincs-plus
    - ed25519

services:
  # LSP Server (replicas for high availability)
  lsp-server:
    image: error-lang-lsp:latest
    build:
      context: .
      dockerfile: Containerfile.lsp
      args:
        DENO_VERSION: "1.40.0"
    replicas: 2
    networks:
      - error-lang-network
    environment:
      - RUST_LOG=info
      - ERROR_LANG_DEBUG=false
    healthcheck:
      test: ["CMD", "deno", "run", "--allow-net", "health-check.ts"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  # VM Runtime (on-demand scaling)
  vm-runtime:
    image: error-lang-vm:latest
    build:
      context: .
      dockerfile: Containerfile.vm
      args:
        RESCRIPT_VERSION: "11.0.0"
    networks:
      - error-lang-network
    environment:
      - STABILITY_TRACKING=enabled
      - PARADOX_DETECTION=enabled
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # IDE/Playground (web-based)
  ide:
    image: error-lang-ide:latest
    build:
      context: .
      dockerfile: Containerfile.ide
    ports:
      - "8080:8080"
    networks:
      - error-lang-network
    depends_on:
      - lsp-server
      - vm-runtime
    environment:
      - LSP_URL=http://lsp-server:8765
      - VM_URL=http://vm-runtime:9000
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

networks:
  error-lang-network:
    driver: bridge

# Vordr verification manifest
x-vordr:
  formal-verification:
    enabled: true
    properties:
      - name: "stability-bounded"
        description: "Stability scores always in [0, 100]"
        proof: "proofs/stability-bounds.idr"
      - name: "positional-deterministic"
        description: "Operator behavior deterministic for position"
        proof: "proofs/positional-semantics.idr"
      - name: "paradox-monotonic"
        description: "Paradoxes increase with complexity"
        proof: "proofs/paradox-monotonicity.idr"
  provenance:
    slsa-level: 3
    build-platform: "github-actions"
    source-repo: "github.com/hyperpolymath/error-lang"
